[pycodestyle]
max-line-length = 79
# A las exclusiones predeterminadas de pycodestyle se suman dos rasgos
# deliberados del estilo del proyecto:
#   E265: comentarios de sección con el marcador '#/'
#   E128: sangría de continuación alineada con la apertura
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E265,E128

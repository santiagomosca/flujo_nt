[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flujo_nt"
version = "0.1.0"
description = "Análisis de trayectorias de dinámica molecular de flujo a través de nanotubos"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santiago Mosca", email = "santiagomosca85@gmail.com" }]
dependencies = [
    "numpy>=1.22",
    "netCDF4>=1.6",
]

[project.scripts]
flujo-nt = "flujo_nt.cli:main"

[project.optional-dependencies]
desarrollo = [
    "pytest>=7",
    "pycodestyle>=2.9",
    "numpydoc>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
